device:
  device: cpu
  cpu_worker_count: 1
  gpu_ids: null
  max_parallel_per_gpu: null
  gpu_launch_interval_sec: null

defaults:
  dataset:
    data_range: [0.0, 1.0]
    val_ratio: 0.25
    test_ratio: 0.25
  model:
    hidden_dim: 16
  trainer:
    optimizer: adam
    collect_grad_stats: false
    gradient_clip: false
    gradient_clip_max_norm: 1.0
    sim_epoch_refresh: false
    show_progress: false
    log_every_epoch: false
  stage:
    grid:
      patience: 80
      repeats: 1
    verify:
      patience: 150
      repeats: 5

search_space:
  dataset:
    datasets: [cora]
  feature_transformation:
    features: [raw]
    sim_reference_eps: []
    feature_dim: []
    scale: []
    random_normal_mean: []
    random_normal_std: []
    shared_value: []
    degree_bucket_num_buckets: []
    degree_bucket_range_max: []
    deepwalk_walk_length: []
    deepwalk_number_walks: []
    deepwalk_window_size: []
    deepwalk_workers: []
    deepwalk_undirected: []
  feature_perturbation:
    mechanisms: [hds]
    x_eps: [inf]
    m: [best]
  calibrator:
    norm: [false]
    norm_scale: []
    x_steps: [0]
    smoother: [kprop]
  model:
    backbones: [sage]
    dropout: [0.5]
  trainer:
    learning_rate: [0.001]
    weight_decay: [0]
  nfr:
    use_nfr: [false]
    tao2: []
